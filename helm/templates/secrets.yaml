{{- if not .Values.rabbit.existingSecret }}
{{- if not .Values.rabbit.password }}
  {{- fail "rabbit credentials are required: set rabbit.existingSecret or rabbit.password (see values.yaml for all scenarios)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dwc-dp-analyser.fullname" . }}-rabbit
  labels:
    {{- include "dwc-dp-analyser.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.rabbit.password | quote }}
---
{{- end }}
{{- if not .Values.registry.existingSecret }}
{{- if not .Values.registry.password }}
  {{- fail "registry credentials are required: set registry.existingSecret or registry.password (see values.yaml for all scenarios)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dwc-dp-analyser.fullname" . }}-registry
  labels:
    {{- include "dwc-dp-analyser.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.registry.password | quote }}
{{- end }}
