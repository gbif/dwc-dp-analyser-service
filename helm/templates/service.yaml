apiVersion: v1
kind: Service
metadata:
  name: {{ include "dwc-dp-analyser.fullname" . }}
spec:
  type: ClusterIP
  selector:
    {{- include "dwc-dp-analyser.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
