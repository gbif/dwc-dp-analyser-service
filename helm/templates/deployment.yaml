apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwc-dp-analyser
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dwc-dp-analyser
  template:
    metadata:
      labels:
        app: dwc-dp-analyser
    spec:
      {{- with .Values.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{ end }}
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox
          command: ['sh', '-c', 'for i in 1 2 3; do nc -z {{ .Values.rabbit.host }} {{ .Values.rabbit.port }} && exit 0 || sleep 5; done; exit 1']
      containers:
        - name: dwc-dp-analyser
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JVM_OPTIONS
              value: {{ .Values.jvmOptions | quote }}
            - name: RABBIT_HOST
              value: {{ .Values.rabbit.host | quote }}
            - name: RABBIT_PORT
              value: {{ .Values.rabbit.port | quote }}
            - name: RABBIT_VHOST
              value: {{ .Values.rabbit.vhost | quote }}
            - name: DUCKDB_MEMORY
              value: {{ .Values.duckdb.memory | quote }}
            - name: DUCKDB_TEMP_DIR
              value: {{ .Values.duckdb.tempDir | quote }}
            - name: INPUT_QUEUE
              value: {{ .Values.rabbit.inputQueue | quote }}
            - name: OUTPUT_EXCHANGE
              value: {{ .Values.rabbit.outputExchange | quote }}
            - name: OUTPUT_ROUTING_KEY
              value: {{ .Values.rabbit.outputRoutingKey | quote }}
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbit.credentialsSecret }}
                  key: username
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbit.credentialsSecret }}
                  key: password
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            # Readyness-check on rabbitMQ
            exec:
              command: ["pgrep", "-f", "service.jar"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          volumeMounts:
            - name: incoming
              mountPath: /data/datapackages
              readOnly: true
              # Impherial mount
            - name: workdir
              mountPath: /data/workdir
            - name: logback-config
              mountPath: /app/config/logback.xml
              subPath: logback.xml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: logback-config
          configMap:
            name: dwc-dp-analyser-logback
        - name: workdir
          {{- if .Values.volumes.workdir }}
          {{- toYaml .Values.volumes.workdir | nindent 10}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: incoming
          {{- if .Values.volumes.incoming }}
          {{- toYaml .Values.volumes.incoming | nindent 10}}
          {{- else }}
          emptyDir: {}
          {{- end }}
