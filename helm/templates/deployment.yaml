apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dwc-dp-analyser.fullname" . }}
  labels:
    {{- include "dwc-dp-analyser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dwc-dp-analyser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dwc-dp-analyser.labels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/component: worker
{{- if .Values.yunikorn.enabled }}
        yunikorn.apache.org/app-id: {{ .Values.yunikorn.appId | quote }}
        yunikorn.apache.org/queue: {{ .Values.yunikorn.queue | quote }}
{{- end }}
      annotations:
        checksum: {{ toYaml .Values | sha256sum }}
    spec:
      {{- with .Values.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{ end }}
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox
          command: ['sh', '-c', 'for i in 1 2 3; do nc -z {{ .Values.rabbit.host }} {{ .Values.rabbit.port }} && exit 0 || sleep 5; done; exit 1']
      containers:
        - name: dwc-dp-analyser
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JVM_OPTIONS
              value: {{ .Values.jvmOptions | quote }}
            - name: RABBIT_HOST
              value: {{ .Values.rabbit.host | quote }}
            - name: RABBIT_PORT
              value: {{ .Values.rabbit.port | quote }}
            - name: RABBIT_VHOST
              value: {{ .Values.rabbit.vhost | quote }}
            - name: DUCKDB_MEMORY
              value: {{ .Values.duckdb.memory | quote }}
            - name: DUCKDB_TEMP_DIR
              value: {{ .Values.duckdb.tempDir | quote }}
            - name: INPUT_QUEUE
              value: {{ .Values.rabbit.inputQueue | quote }}
            - name: OUTPUT_EXCHANGE
              value: {{ .Values.rabbit.outputExchange | quote }}
            - name: OUTPUT_ROUTING_KEY
              value: {{ .Values.rabbit.outputRoutingKey | quote }}
            - name: RABBIT_USER
              {{- if and .Values.rabbit.existingSecret .Values.rabbit.existingSecret.keyUsername }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbit.existingSecret.name }}
                  key: {{ .Values.rabbit.existingSecret.keyUsername }}
              {{- else }}
              value: {{ .Values.rabbit.username | required "rabbit.username is required when not using existingSecret.keyUsername" | quote }}
              {{- end }}
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.rabbit.existingSecret }}
                  name: {{ .Values.rabbit.existingSecret.name }}
                  key: {{ .Values.rabbit.existingSecret.keyPassword | required "rabbit.existingSecret.keyPassword is required when existingSecret is set" }}
                  {{- else }}
                  name: {{ include "dwc-dp-analyser.fullname" . }}-rabbit
                  key: password
                  {{- end }}
            - name: REGISTRY_URL
              value: {{ .Values.registry.url | required "registry.url is required" | quote }}
            - name: REGISTRY_USER
              {{- if and .Values.registry.existingSecret .Values.registry.existingSecret.keyUsername }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.existingSecret.name }}
                  key: {{ .Values.registry.existingSecret.keyUsername }}
              {{- else }}
              value: {{ .Values.registry.username | required "registry.username is required when not using existingSecret.keyUsername" | quote }}
              {{- end }}
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.registry.existingSecret }}
                  name: {{ .Values.registry.existingSecret.name }}
                  key: {{ .Values.registry.existingSecret.keyPassword | required "registry.existingSecret.keyPassword is required when existingSecret is set" }}
                  {{- else }}
                  name: {{ include "dwc-dp-analyser.fullname" . }}-registry
                  key: password
                  {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "service.jar"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          volumeMounts:
            - name: incoming
              mountPath: /data/datapackages
              readOnly: true
            - name: workdir
              mountPath: /data/workdir
            - name: logback-config
              mountPath: /app/config/logback.xml
              subPath: logback.xml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: logback-config
          configMap:
            name: {{ include "dwc-dp-analyser.fullname" . }}-logback
        - name: workdir
          {{- if .Values.volumes.workdir }}
          {{- toYaml .Values.volumes.workdir | nindent 10}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: incoming
          {{- if .Values.volumes.incoming }}
          {{- toYaml .Values.volumes.incoming | nindent 10}}
          {{- else }}
          emptyDir: {}
          {{- end }}
