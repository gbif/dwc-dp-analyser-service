replicaCount: 1

image:
  # Replace repository with actual repository value
  repository: docker.io
  name: dwc-dp-analyser-service
  tag: latest
  pullPolicy: Always

jvmOptions: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx1g -Dlogback.configurationFile=/app/config/logback.xml"

rabbit:
  host: localhost
  port: 5672
  vhost: /
  inputQueue: dwcdp-validator
  outputExchange: crawler
  outputRoutingKey: crawl.dwcdp.validation.finished
  username: guest
  password: guest
  createSecret: false
  credentialsSecret: dwc-dp-analyser-rabbitmq-credentials

duckdb:
  # The app is mainly hungry for memory with duck db, not the java process
  memory: "2 Gib"

environment: default

log:
  level: INFO
  logback:
    config: |
      <configuration>
        <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
          <encoder class="ch.qos.logback.classic.encoder.PatternLayoutEncoder">
            <pattern>%d{HH:mm:ss} %-5level %logger{36} - %msg%n</pattern>
          </encoder>
        </appender>
        <root level="${LOG_LEVEL:-INFO}">
          <appender-ref ref="CONSOLE"/>
        </root>
      </configuration>

volumes:
  # Volume backing for the two mount points the app requires.
  # Accepts any Kubernetes volume type (nfs, persistentVolumeClaim, emptyDir, etc.)
  # Override in environment values to match your infrastructure.
  # See: https://kubernetes.io/docs/concepts/storage/volumes/#volume-types
  incoming:
    emptyDir: {}
  workdir:
    emptyDir: {}

service:
  port: 8080

resources:
  requests:
    memory: 512Mi
    cpu: 250m
    ephemeral-storage: 20Gi
  limits:
    memory: 3.5Gi
    cpu: 2000m
