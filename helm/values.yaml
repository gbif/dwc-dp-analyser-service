replicaCount: 1

label:
  app: dwc-dp-analyser

image:
  # Replace repository with actual repository value
  repository: docker.io
  name: dwc-dp-analyser-service
  tag: latest
  pullPolicy: Always

jvmOptions: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=30.0 -Xms256m -Xmx1g -Dlogback.configurationFile=/app/config/logback.xml"

rabbit:
  host: localhost
  port: 5672
  vhost: /
  inputQueue: dwcdp-validator
  outputExchange: crawler
  outputRoutingKey: crawl.dwcdp.validation.finished
  # Scenario 1 — both username and password from existing secret:
  #   existingSecret:
  #     name: my-secret
  #     keyUsername: username
  #     keyPassword: password
  #
  # Scenario 2 — password from existing secret, username inline:
  #   username: guest
  #   existingSecret:
  #     name: my-secret
  #     keyPassword: password
  #
  # Scenario 3 — both inline (chart creates a Kubernetes secret for the password):
  #   username: guest
  #   password: my-password
  username: guest
  password: ""
  existingSecret: {}

registry:
  # Required — no default. Example: https://api.gbif-dev.org/v1
  url: ""
  # Scenario 1 — both username and password from existing secret:
  #   existingSecret:
  #     name: my-secret
  #     keyUsername: username
  #     keyPassword: password
  #
  # Scenario 2 — password from existing secret, username inline:
  #   username: my-admin-user
  #   existingSecret:
  #     name: my-secret
  #     keyPassword: password
  #
  # Scenario 3 — both inline (chart creates a Kubernetes secret for the password):
  #   username: my-admin-user
  #   password: my-password
  username: ""
  password: ""
  existingSecret: {}

duckdb:
  # The app is mainly hungry for memory with duck db, not the java process
  memory: "2Gib"
  tempDir: ""

environment: default

log:
  level: INFO
  logback:
    config: |
      <configuration>
        <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
          <encoder class="ch.qos.logback.classic.encoder.PatternLayoutEncoder">
            <pattern>%d{HH:mm:ss} %-5level %logger{36} - %msg%n</pattern>
          </encoder>
        </appender>
        <root level="${LOG_LEVEL:-INFO}">
          <appender-ref ref="CONSOLE"/>
        </root>
      </configuration>

service:
  port: 8080

resources:
  requests:
    memory: 512Mi
    cpu: 250m
    ephemeral-storage: 20Gi
  limits:
    memory: 3.5Gi
    cpu: 2000m
