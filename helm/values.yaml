replicaCount: 1

image:
  # Replace repository with actual repository value
  repository: docker.io
  name: dwc-dp-analyser-service
  tag: latest
  pullPolicy: Always

jvmOptions: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx2g"

rabbit:
  host: localhost
  port: 5672
  vhost: /
  inputQueue: dwcdp.validator
  outputExchange: crawler
  outputRoutingKey: crawl.dwcdp.validation.finished
  username: guest
  password: guest
  createSecret: false
  credentialsSecret: dwc-dp-analyser-rabbitmq-credentials

volumes:
  # Volume backing for the two mount points the app requires.
  # Accepts any Kubernetes volume type (nfs, persistentVolumeClaim, emptyDir, etc.)
  # Override in environment values to match your infrastructure.
  # See: https://kubernetes.io/docs/concepts/storage/volumes/#volume-types
  incoming:
    emptyDir: {}
  workdir:
    emptyDir: {}

service:
  port: 8080

resources:
  requests:
    memory: 512Mi
    cpu: 250m
    ephemeral-storage: 20Gi
  limits:
    memory: 3Gi
    cpu: 2000m
