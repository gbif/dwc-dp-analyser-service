version: '3'

vars:
  IMAGE: '{{.IMAGE | default "dwc-dp-analyser-service:latest"}}'
  BASE_REGISTRY: '{{.BASE_REGISTRY | default "docker.gbif.org/third-party"}}'
  CONTAINER_CLI:
    sh: |
      if command -v podman >/dev/null 2>&1; then
        echo podman
      elif docker --version 2>/dev/null | grep -qi podman; then
        echo podman
      elif command -v docker >/dev/null 2>&1; then
        echo docker
      else
        echo docker
      fi

tasks:
  clean:
    desc: Run Maven clean
    cmds:
      - mvn clean

  package:
    desc: Build the fat jar (skip tests)
    cmds:
      - mvn package -DskipTests

  verify:
    desc: Run full Maven verify lifecycle including tests
    cmds:
      - mvn verify

  docker:build:
    desc: Build Docker image from the already-built runner jar (IMAGE=name:tag)
    cmds:
      - |
        JAR_DIR="dwc-dp-analyser-service-app/target"
        JAR_PATTERN="${JAR_DIR}/*-runner.jar"
        JARS=()
        while IFS= read -r jar; do
          JARS+=("$jar")
        done < <(compgen -G "$JAR_PATTERN" || true)

        if [ "${#JARS[@]}" -eq 0 ]; then
          echo >&2 "ERROR: Could not find ${JAR_PATTERN}"
          echo >&2 "Run 'mvn package' before building the Docker image."
          exit 1
        fi

        if [ "${#JARS[@]}" -gt 1 ]; then
          echo >&2 "ERROR: Found multiple runner JARs:"
          printf >&2 '  %s\n' "${JARS[@]}"
          echo >&2 "Run 'mvn clean package' to produce an unambiguous build."
          exit 1
        fi

        JAR_FILE="${JARS[0]}"

        if [ "{{.CONTAINER_CLI}}" = "docker" ]; then
          export DOCKER_BUILDKIT=1
        fi

        {{.CONTAINER_CLI}} build \
          --build-arg BASE_REGISTRY={{.BASE_REGISTRY}} \
          --build-arg JAR_FILE="${JAR_FILE}" \
          -t {{.IMAGE}} .

  docker:push:dist:
    desc: Build and push multi-arch Docker image from the already-built runner jar
    prompt: Do you want to build and push the multi-arch image to the registry?
    requires:
      vars: [REGISTRY]
    vars:
      POM_VERSION:
        sh: mvn help:evaluate -Dexpression=project.version -q -DforceStdout
      FULL_IMAGE: '{{.REGISTRY}}/dwc-dp-analyser-service:{{.POM_VERSION}}'
    cmds:
      - |
        JAR_FILE=$(compgen -G "dwc-dp-analyser-service-app/target/*-runner.jar" | head -n 1)
        if [ -z "$JAR_FILE" ]; then
          echo >&2 "ERROR: Could not find dwc-dp-analyser-service-app/target/*-runner.jar"
          echo >&2 "Run 'mvn package' before building the Docker image."
          exit 1
        fi
        if [ "{{.CONTAINER_CLI}}" = "docker" ]; then
          export DOCKER_BUILDKIT=1
        fi
        {{.CONTAINER_CLI}} build \
          --platform linux/amd64 \
          --build-arg BASE_REGISTRY={{.BASE_REGISTRY}} \
          --build-arg JAR_FILE="$JAR_FILE" \
          -t {{.FULL_IMAGE}}-amd64 .
      - |
        JAR_FILE=$(compgen -G "dwc-dp-analyser-service-app/target/*-runner.jar" | head -n 1)
        if [ "{{.CONTAINER_CLI}}" = "docker" ]; then
          export DOCKER_BUILDKIT=1
        fi
        {{.CONTAINER_CLI}} build \
          --platform linux/arm64 \
          --build-arg BASE_REGISTRY={{.BASE_REGISTRY}} \
          --build-arg JAR_FILE="$JAR_FILE" \
          -t {{.FULL_IMAGE}}-arm64 .
      - '{{.CONTAINER_CLI}} push {{.FULL_IMAGE}}-amd64'
      - '{{.CONTAINER_CLI}} push {{.FULL_IMAGE}}-arm64'
      - |
        if [ "{{.CONTAINER_CLI}}" = "podman" ]; then
          {{.CONTAINER_CLI}} manifest create {{.FULL_IMAGE}}
          {{.CONTAINER_CLI}} manifest add {{.FULL_IMAGE}} {{.FULL_IMAGE}}-amd64
          {{.CONTAINER_CLI}} manifest add {{.FULL_IMAGE}} {{.FULL_IMAGE}}-arm64
          {{.CONTAINER_CLI}} manifest push {{.FULL_IMAGE}}
        else
          {{.CONTAINER_CLI}} buildx imagetools create -t {{.FULL_IMAGE}} {{.FULL_IMAGE}}-amd64 {{.FULL_IMAGE}}-arm64
        fi
      - '{{.CONTAINER_CLI}} image rm {{.FULL_IMAGE}}-amd64 || true'
      - '{{.CONTAINER_CLI}} image rm {{.FULL_IMAGE}}-arm64 || true'

  docker:run:
    desc: Run the Docker image
    requires:
      vars: [ARCHIVE_REPOSITORY, WORKDIR, REGISTRY_URL, REGISTRY_USER, REGISTRY_PASSWORD]
    cmds:
      - '{{.CONTAINER_CLI}} run --rm
        --memory=4g
        --memory-swap=4g
        -v {{.ARCHIVE_REPOSITORY}}:/data/datapackages
        -v {{.WORKDIR}}:/data/workdir
        -e JVM_OPTIONS="-Xms256m -Xmx1g"
        -e RABBIT_HOST={{.RABBIT_HOST | default "localhost"}}
        -e RABBIT_PORT={{.RABBIT_PORT | default "5672"}}
        -e RABBIT_USER={{.RABBIT_USER | default "guest"}}
        -e RABBIT_PASSWORD={{.RABBIT_PASSWORD | default "guest"}}
        -e RABBIT_VHOST={{.RABBIT_VHOST | default "/"}}
        -e REGISTRY_URL={{.REGISTRY_URL}}
        -e REGISTRY_USER={{.REGISTRY_USER}}
        -e REGISTRY_PASSWORD={{.REGISTRY_PASSWORD}}
        -e INPUT_QUEUE={{.INPUT_QUEUE | default "dwcdp-validator"}}
        -e OUTPUT_EXCHANGE={{.OUTPUT_EXCHANGE | default "crawler"}}
        -e OUTPUT_ROUTING_KEY={{.OUTPUT_ROUTING_KEY | default "crawl.dwcdp.validation.finished"}}
        {{.IMAGE}}'

  docker:run:local:
    desc: Run with archive and unpack repos pointing to ~/data
    vars:
      GATEWAY:
        sh: bash scripts/gateway.sh | tee
    cmds:
      - mkdir -p {{.HOME}}/data/datapackages
      - mkdir -p {{.HOME}}/data/datapackages-unpacked
      - task: docker:run
        vars:
          ARCHIVE_REPOSITORY: '{{.HOME}}/data/datapackages'
          UNPACK_REPOSITORY: '{{.HOME}}/data/datapackages-unpacked'
          RABBIT_HOST: '{{.GATEWAY}}'

  local:
    desc: DwcDp Analyse Service locally, including required services such as RabbitMQ and a mock for registry
    cmds:
      - '{{.CONTAINER_CLI}} compose -f docker-compose.yml up'

  dist:
    desc: Build jar and Docker image
    cmds:
      - task: package
      - task: docker:push:dist
