services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI at localhost:15672

  analyser:
    image: '${IMAGE:-dwc-dp-analyser-service:latest}'
    depends_on:
      - rabbitmq
    environment:
      RABBIT_HOST: rabbitmq  # service name resolves via Docker DNS
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
    volumes:
      - '${HOME}/data/datapackages:/data/datapackages'
      - '${HOME}/data/datapackages-unpacked:/data/datapackages-unpacked'
